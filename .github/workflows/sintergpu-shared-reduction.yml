name: SinterGPU shared reduction source parity
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-parity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2026.12'
            sha256: 2409ecc7b6710783e05fd59792558c275c637e3e3c37fb5054fcfc858e570d82
          - version: '2026.19'
            sha256: bd6cfc47b7353b2cffa36a866b1584749f76f4b2dbebf6dda26bc3fb40dc3c0e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install hash-pinned released wheel and CPU dependencies
        run: |
          python -m pip install 'numpy>=2.1,<3' 'pytest>=8,<10'
          python -m pip install --no-deps 'sintergpu @ https://github.com/bjoernellens1/sintergpu/releases/download/v0.2.11/sintergpu-0.2.11-py3-none-any.whl#sha256=382556691f278c9aeb033e99ea086b72d6fc546a513e2d603ebec694e4a18113'
      - name: Download pinned compiler
        env:
          SLANG_VERSION: ${{ matrix.version }}
          SLANG_SHA256: ${{ matrix.sha256 }}
        run: |
          curl --fail --location --retry 3 "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" -o /tmp/slang.tar.gz
          echo "${SLANG_SHA256}  /tmp/slang.tar.gz" | sha256sum --check
          mkdir /tmp/slang && tar -xzf /tmp/slang.tar.gz -C /tmp/slang
      - name: Check CPU tree, composition and real consumer call site
        env:
          PYTHONPATH: python:.
          SINTERGPU_TEST_RELEASED: '1'
        run: |
          python -m pytest tests/test_sintergpu_reduction_migration.py -q -m 'not gpu' -k 'not 2026.12 and not 2026.19' --junitxml=cpu.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('cpu.xml').getroot(); s=[r] if r.tag=='testsuite' else r.findall('testsuite')
          assert sum(int(x.get('tests',0)) for x in s)==13 and sum(int(x.get('skipped',0)) for x in s)==0
          PY
      - name: Compile and reflect baseline and released source
        env:
          PYTHONPATH: python:.
          SINTERGPU_TEST_RELEASED: '1'
          SLANG_VERSION: ${{ matrix.version }}
        run: |
          test -x /tmp/slang/bin/slangc
          test "$(/tmp/slang/bin/slangc -version 2>&1)" = "$SLANG_VERSION"
          export "SINTERGPU_SLANGC_${SLANG_VERSION//./_}=/tmp/slang/bin/slangc"
          python -m pytest tests/test_sintergpu_reduction_migration.py -q -m 'not gpu' -k "$SLANG_VERSION" --junitxml=compiler.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          r=ET.parse('compiler.xml').getroot(); s=[r] if r.tag=='testsuite' else r.findall('testsuite')
          assert sum(int(x.get('tests',0)) for x in s)==1 and sum(int(x.get('skipped',0)) for x in s)==0
          PY
