name: Shared kernel dependency contracts
on:
  pull_request:
  push:
    branches: ['feat/sintergpu-reduction']
permissions:
  contents: read
jobs:
  released-source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install '.[shared-reduction]' pytest numpy
      - name: Check released helper bytes, default route and cache invalidation
        run: python -m pytest tests/test_shared_reduction.py -m 'not gpu' -q
