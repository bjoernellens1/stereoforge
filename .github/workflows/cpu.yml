name: CPU contracts and replay
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'
      - name: Install headers for CPU Vulkan contract probes
        run: sudo apt-get update -qq && sudo apt-get install -y libvulkan-dev nlohmann-json3-dev
      - run: uv sync --locked --extra test --python 3.12
      - run: uv run python -m pytest -m 'not gpu' -q
      - run: cmake --preset cpu && cmake --build --preset cpu && ctest --preset cpu
